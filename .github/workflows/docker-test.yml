name: Docker Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpine:
    name: Alpine test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build test image
        run: docker build -f test/images/alpine.Dockerfile -t copy-test-alpine .
      - name: Test as a non-root user
        run: docker run --rm copy-test-alpine
